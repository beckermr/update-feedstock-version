name: update feedstock version
on:
  workflow_dispatch: null
  push:
    branches:
      - main
  pull_request: null

concurrency:
  group: cf-autotick-bot-test-package-feedstock
  cancel-in-progress: false

jobs:
  update-feedstock-version:
    runs-on: ubuntu-latest
    name: update-feedstock-version
    steps:
      - name: update feedstock version
        id: update
        uses: $/
        with:
          feedstock: cf-autotick-bot-test-package-feedstock
          version: "0.13"
          github-token: ${{ secrets.GH_PAT }}
          automerge: false

      - name: close pr
        run: |
          gh pr close ${{ steps.update.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
